<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vellisa Putri's Portofolio</title>
    <link rel="stylesheet" href="style.css">
    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <div class="app-container">
        <header>
            <nav class="navbar">
                <div class="user-icon-btn">
                    <i class="fa-regular fa-user"></i>
                </div>

                <ul class="nav-center">
                    <li><a href="#home" class="nav-link active">Home</a></li>
                    <li><a href="#about" class="nav-link">About</a></li>
                    <li><a href="#projects" class="nav-link">Projects</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>

                <div class="nav-right">
                    <a href="#contact" class="btn-outline">Hire Me</a>
                </div>
            </nav>
        </header>

        <main>
            <section class="hero-wrapper">
                <button class="banner-arrow left" id="prevSlide" aria-label="Previous Slide">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button class="banner-arrow right" id="nextSlide" aria-label="Next Slide">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

                <div class="fade-logo-text">UI/UX DESIGNER</div>

                <div class="banner-card">
                    <div class="banner-content">
                        <h1 class="banner-title" id="bannerTitleText">Vellisa Putri</h1>
                        <p class="banner-subtitle" id="bannerDescTect">
                            A student currently training to become a profesional UI/UX Designer and continuously developing skill in her field of interest.
                        </p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <link rel="stylesheet" href="script.js">
</body>
</html>
